<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Brain Ops — Metrics</title>
<style>
  :root {
    --bg: #0e0d0c;
    --fg: #eadfc8;
    --dim: #8a8275;
    --line: #2c2925;
    --panel: rgba(20, 18, 15, 0.88);
    --accent: #9a8f6c;
    --ok: #6b8f71;
    --skip: #8a8275;
    --err: #a86c6c;
    --read: #6a7d8f;
    --write: #8f7a6a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background: radial-gradient(ellipse at top, #141210 0%, var(--bg) 70%);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #tabs {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 4px; z-index: 20;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 4px;
    backdrop-filter: blur(10px);
  }
  #tabs a {
    color: var(--dim); text-decoration: none; font-size: 12px;
    padding: 7px 16px; border-radius: 9px; transition: .15s;
  }
  #tabs a:hover { color: var(--fg); background: rgba(255,255,255,0.04); }
  #tabs a.active { color: var(--fg); background: rgba(201,178,122,0.12); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 64px 20px 32px; }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  .toolbar h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .toolbar select, .toolbar button {
    background: #161412; color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .toolbar button:hover { background: #221e19; }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px 18px;
  }
  .card .label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 6px; line-height: 1.1; }
  .card .sub { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .card.roi { border-color: rgba(201,178,122,0.25); }
  .grid2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px;
  }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px;
  }
  .panel h2 {
    margin: 0 0 12px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .07em; color: var(--dim); font-weight: 600;
  }
  canvas.chart { width: 100%; height: 180px; display: block; }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .bar-row .name { width: 72px; color: var(--dim); text-transform: capitalize; flex-shrink: 0; }
  .bar-row .track { flex: 1; height: 8px; background: #1a1714; border-radius: 4px; overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: 4px; }
  .bar-row .count { width: 36px; text-align: right; color: var(--dim); font-size: 11px; }
  .feed {
    max-height: 340px; overflow-y: auto;
    font-size: 12px; line-height: 1.45;
  }
  .feed-item {
    padding: 8px 10px; border-radius: 8px; margin-bottom: 4px;
    border-left: 3px solid var(--line);
    background: rgba(255,255,255,0.02);
  }
  .feed-item.read { border-left-color: var(--read); }
  .feed-item.write { border-left-color: var(--write); }
  .feed-item.ok { border-left-color: var(--ok); }
  .feed-item.skip { border-left-color: var(--skip); }
  .feed-item.error { border-left-color: var(--err); }
  .feed-item .ts { font-size: 10px; color: var(--dim); margin-bottom: 2px; }
  .errors { margin-top: 10px; }
  .errors .tag {
    display: inline-block; margin: 3px 6px 3px 0; padding: 4px 10px;
    background: rgba(168,108,108,0.12); border-radius: 8px;
    font-size: 11px; color: #c99;
  }
  .note { font-size: 11px; color: var(--dim); margin-top: 16px; text-align: center; }
  #load-err { color: var(--err); padding: 40px; text-align: center; display: none; }
</style>
</head>
<body>
<nav id="tabs">
  <a href="/">Память</a>
  <a href="/autolog.html">Сессии</a>
  <a href="/ops.html" class="active">Ops</a>
</nav>

<div class="wrap">
  <div class="toolbar">
    <h1>Brain Ops</h1>
    <div>
      <select id="days" title="Период">
        <option value="7">7 дней</option>
        <option value="14">14 дней</option>
        <option value="30" selected>30 дней</option>
        <option value="90">90 дней</option>
      </select>
      <button type="button" id="refresh">Обновить</button>
    </div>
  </div>

  <div id="load-err"></div>

  <div class="cards" id="cards"></div>

  <div class="grid2">
    <div class="panel">
      <h2>Активность по дням</h2>
      <canvas id="daily-chart" class="chart"></canvas>
    </div>
    <div class="panel">
      <h2>Hooks (OK / Skip / Error)</h2>
      <div id="hook-bars" class="bars"></div>
    </div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>Источники записей</h2>
      <div id="write-bars" class="bars"></div>
    </div>
    <div class="panel">
      <h2>Ошибки</h2>
      <div id="errors" class="errors"><span class="tag" style="opacity:.5">нет</span></div>
    </div>
  </div>

  <div class="panel" style="margin-top:14px">
    <h2>Live feed · последние события</h2>
    <div id="feed" class="feed"></div>
  </div>

  <p class="note" id="roi-note"></p>
</div>

<script>
(function () {
  "use strict";

  const daysEl = document.getElementById("days");
  const refreshBtn = document.getElementById("refresh");
  const cardsEl = document.getElementById("cards");
  const feedEl = document.getElementById("feed");
  const hookBars = document.getElementById("hook-bars");
  const writeBars = document.getElementById("write-bars");
  const errorsEl = document.getElementById("errors");
  const roiNote = document.getElementById("roi-note");
  const loadErr = document.getElementById("load-err");
  const dailyCanvas = document.getElementById("daily-chart");
  const dailyCtx = dailyCanvas.getContext("2d");

  const COLORS = {
    reads: "#6a7d8f", writes: "#8f7a6a", hooks: "#9a8f6c",
    ok: "#6b8f71", skip: "#8a8275", error: "#a86c6c", other: "#59544d",
  };

  function fmt(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  }

  function fmtTs(raw) {
    if (!raw) return "";
    try { return new Date(raw).toLocaleString(); } catch { return raw; }
  }

  function renderBars(container, items, colorKey) {
    container.innerHTML = "";
    if (!items || !items.length) {
      container.innerHTML = '<span style="color:var(--dim);font-size:12px">нет данных</span>';
      return;
    }
    const max = Math.max(...items.map(x => x.count), 1);
    items.forEach(item => {
      const row = document.createElement("div");
      row.className = "bar-row";
      const pct = Math.round(100 * item.count / max);
      const color = COLORS[item.key] || COLORS[item.label?.toLowerCase()] || "var(--accent)";
      row.innerHTML =
        `<span class="name">${item.label}</span>` +
        `<span class="track"><span class="fill" style="width:${pct}%;background:${color}"></span></span>` +
        `<span class="count">${item.count}</span>`;
      container.appendChild(row);
    });
  }

  function drawDaily(daily) {
    const dpr = window.devicePixelRatio || 1;
    const w = dailyCanvas.clientWidth;
    const h = dailyCanvas.clientHeight;
    dailyCanvas.width = w * dpr;
    dailyCanvas.height = h * dpr;
    dailyCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dailyCtx.clearRect(0, 0, w, h);

    if (!daily || !daily.length) {
      dailyCtx.fillStyle = "#8a8275";
      dailyCtx.font = "12px sans-serif";
      dailyCtx.fillText("нет данных", 12, 24);
      return;
    }

    const pad = { l: 36, r: 12, t: 12, b: 28 };
    const chartW = w - pad.l - pad.r;
    const chartH = h - pad.t - pad.b;
    const n = daily.length;
    const maxY = Math.max(...daily.map(d => d.reads + d.writes + d.hooks), 1);
    const groupW = chartW / n;
    const barW = Math.min(18, groupW * 0.22);

    daily.forEach((d, i) => {
      const cx = pad.l + i * groupW + groupW / 2;
      let y = pad.t + chartH;
      [
        { key: "reads", val: d.reads },
        { key: "writes", val: d.writes },
        { key: "hooks", val: d.hooks },
      ].forEach((seg, si) => {
        const bh = (seg.val / maxY) * chartH;
        y -= bh;
        dailyCtx.fillStyle = COLORS[seg.key];
        dailyCtx.fillRect(cx - barW * 1.5 + si * barW, y, barW - 2, bh);
      });
      if (n <= 14 || i % Math.ceil(n / 10) === 0) {
        dailyCtx.fillStyle = "#8a8275";
        dailyCtx.font = "9px sans-serif";
        dailyCtx.textAlign = "center";
        dailyCtx.fillText(d.date.slice(5), cx, h - 8);
      }
    });

    dailyCtx.textAlign = "left";
    dailyCtx.fillStyle = "#8a8275";
    dailyCtx.font = "10px sans-serif";
    dailyCtx.fillText("■ reads  ■ writes  ■ hooks", pad.l, 10);
  }

  function renderCards(data) {
    const roi = data.roi || {};
    const cg = data.codegraph || {};
    const mem0 = data.mem0 || {};
    const nt = roi.net_tokens || {};
    const nu = roi.net_usd || {};
    const share = Math.round((roi.measured_share != null ? roi.measured_share : 1) * 100);
    const items = [
      { label: "Net tokens saved (est.)", value: "~" + fmt(nt.mid || 0), sub: "~$" + (nu.mid || 0) + " · range " + fmt(nt.low || 0) + "–" + fmt(nt.high || 0), cls: "roi" },
      { label: "Memory cost (Cursor)", value: "~" + fmt((roi.context_injected_tokens || 0) + (roi.write_tokens || 0)) + " tok", sub: fmt(roi.context_injected_tokens || 0) + " in · " + fmt(roi.write_tokens || 0) + " out" },
      { label: "Measured share", value: share + "%", sub: "rest = row-count est." },
      { label: "Mem reads", value: data.mem_reads || 0, sub: (data.read_rows_total || 0) + " rows" },
      { label: "Mem writes", value: data.mem_writes || 0, sub: fmt(data.stored_chars_total || 0) + " chars" },
      { label: "MCP hits", value: data.mcp_search_hits || 0, sub: (data.hybrid_reads || 0) + " hybrid" },
      { label: "Mem0 store", value: mem0.total_memories ?? "—", sub: mem0.collection || "" },
      { label: "CodeGraph", value: cg.available ? (cg.indexed + "/" + cg.total) : "—", sub: cg.available ? "indexed" : "n/a" },
      { label: "Events", value: data.event_count || 0, sub: data.period_days + "d window" },
    ];
    cardsEl.innerHTML = items.map(c =>
      `<div class="card ${c.cls || ""}"><div class="label">${c.label}</div><div class="value">${c.value}</div><div class="sub">${c.sub || ""}</div></div>`
    ).join("");
    roiNote.textContent = roi.note || "";
  }

  function renderFeed(recent) {
    feedEl.innerHTML = "";
    if (!recent || !recent.length) {
      feedEl.innerHTML = '<span style="color:var(--dim)">нет событий за период</span>';
      return;
    }
    recent.forEach(ev => {
      const div = document.createElement("div");
      div.className = "feed-item " + (ev.kind || "other");
      div.innerHTML = `<div class="ts">${fmtTs(ev.ts)}</div><div>${ev.summary || ev.event || ""}</div>`;
      feedEl.appendChild(div);
    });
  }

  function renderErrors(errors) {
    const keys = Object.keys(errors || {});
    if (!keys.length) {
      errorsEl.innerHTML = '<span class="tag" style="opacity:.5">нет</span>';
      return;
    }
    errorsEl.innerHTML = keys.map(k =>
      `<span class="tag">${k}: ${errors[k]}</span>`
    ).join("");
  }

  async function load() {
    const days = daysEl.value;
    loadErr.style.display = "none";
    if (location.protocol === "file:") {
      loadErr.style.display = "block";
      loadErr.textContent = "Откройте через viewer: http://127.0.0.1:8501/ops.html (не file://)";
      return;
    }
    try {
      const res = await fetch(`/api/metrics?days=${days}&recent=80`);
      const ct = (res.headers.get("content-type") || "").toLowerCase();
      if (!ct.includes("json")) {
        throw new Error(
          "Сервер вернул HTML вместо JSON. Остановите старый viewer и запустите start.bat заново."
        );
      }
      const data = await res.json();
      if (data.error && !data.event_count && data.error !== "unknown_api") throw new Error(data.error);
      if (data.error === "unknown_api") {
        throw new Error("API /api/metrics не найден — перезапустите viewer (start.bat).");
      }
      renderCards(data);
      drawDaily(data.daily || []);
      renderBars(hookBars, data.hook_chart || [], "hook");
      renderBars(writeBars, data.write_chart || [], "write");
      renderErrors(data.errors);
      renderFeed(data.recent || []);
    } catch (e) {
      loadErr.style.display = "block";
      loadErr.textContent = "Не удалось загрузить метрики: " + e.message;
    }
  }

  daysEl.addEventListener("change", load);
  refreshBtn.addEventListener("click", load);
  window.addEventListener("resize", () => load());
  setInterval(load, 15000);
  load();
})();
</script>
</body>
</html>
